<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrulyHealthy — Create patient account</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-shell">
  <div class="auth-card" style="max-width:520px;">
    <div class="auth-logo"><span class="pulse-dot"></span> TrulyHealthy</div>
    <p class="auth-tagline">Create your patient account. Doctor, admin, and research accounts are created by an administrator.</p>

    <form id="register-form">
      <div class="form-row">
        <div><label>Full name</label><input name="fullName" required></div>
        <div><label>Email</label><input name="email" type="email"></div>
      </div>
      <div class="form-row">
        <div><label>Username</label><input name="username" required></div>
        <div><label>Password</label><input name="password" type="password" required></div>
      </div>
      <div class="form-row">
        <div><label>Date of birth</label><input name="dob" type="date"></div>
        <div><label>Gender</label>
          <select name="gender">
            <option value="">Select…</option>
            <option>Male</option><option>Female</option><option>Other</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div><label>Blood group</label>
          <select name="bloodGroup">
            <option value="">Select…</option>
            <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
            <option>AB+</option><option>AB-</option><option>O+</option><option>O-</option>
          </select>
        </div>
        <div><label>Contact number</label><input name="contact"></div>
      </div>
      <label>Address</label><textarea name="address" rows="2"></textarea>

      <button type="submit" class="btn btn-primary btn-block" style="margin-top:20px;">Create account</button>
    </form>
    <div class="auth-footer">Already have an account? <a href="index.html">Sign in</a></div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
document.getElementById("register-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const form = new FormData(e.target);
    const payload = Object.fromEntries(form.entries());
    try {
        const data = await apiFetch("/auth/register", { method: "POST", body: JSON.stringify(payload) });
        Auth.save(data.token, data.user);
        toast("Account created — welcome!");
        window.location.href = "patient-dashboard.html";
    } catch (err) {
        toast(err.message, "error");
    }
});
</script>
</body>
</html>
