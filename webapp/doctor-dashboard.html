<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrulyHealthy — Doctor</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="pulse-dot"></span> TrulyHealthy</div>
  <nav id="topbar-nav"></nav>
</header>

<div class="container">
  <h1 class="page-title">Welcome, <span id="welcome-name"></span></h1>
  <p class="page-subtitle">Manage your appointments and update patient treatment records.</p>

  <h2 class="section-heading">My appointments</h2>
  <div class="card table-wrap">
    <table id="appt-table">
      <thead><tr><th>Patient</th><th>Date &amp; time</th><th>Reason</th><th>Status</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="flex-between">
    <h2 class="section-heading" style="margin:0;">My patients</h2>
  </div>
  <div class="card table-wrap">
    <table id="patients-table">
      <thead><tr><th>Patient</th><th>Blood group</th><th>Contact</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <h2 class="section-heading">My profile</h2>
  <div class="card">
    <form id="profile-form">
      <div class="form-row">
        <div><label>Specialization</label><input name="specialization"></div>
        <div><label>License number</label><input name="licenseNo"></div>
      </div>
      <label>Contact number</label><input name="contact">
      <button type="submit" class="btn btn-ghost" style="margin-top:16px;">Save profile</button>
    </form>
  </div>
</div>

<div class="modal-backdrop" id="records-modal" style="display:none;">
  <div class="modal" style="max-width:560px;">
    <h3 id="records-modal-title">Patient records</h3>
    <div class="table-wrap" style="max-height:220px; overflow-y:auto; margin-bottom:16px;">
      <table id="patient-records-table">
        <thead><tr><th>Date</th><th>Diagnosis</th><th>Treatment</th><th>Rx</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <hr class="divider">
    <h3 style="font-size:15px;">Add a new record</h3>
    <form id="add-record-form">
      <div class="form-row">
        <div><label>Visit date</label><input name="visitDate" type="date" required></div>
        <div><label>Diagnosis</label><input name="diagnosis"></div>
      </div>
      <div class="form-row">
        <div><label>Treatment</label><input name="treatment"></div>
        <div><label>Prescription</label><input name="prescription"></div>
      </div>
      <label>Notes</label><textarea name="notes" rows="2"></textarea>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" onclick="closeRecordsModal()">Close</button>
        <button type="submit" class="btn btn-primary">Add record</button>
      </div>
    </form>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/doctor.js"></script>
</body>
</html>
