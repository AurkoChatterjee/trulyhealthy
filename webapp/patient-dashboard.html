<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrulyHealthy — Patient</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="pulse-dot"></span> TrulyHealthy</div>
  <nav id="topbar-nav"></nav>
</header>

<div class="container">
  <h1 class="page-title">Welcome, <span id="welcome-name"></span></h1>
  <p class="page-subtitle">Book, cancel, or reschedule appointments and review your medical history.</p>

  <div class="flex-between">
    <h2 class="section-heading" style="margin:0;">My appointments</h2>
    <button class="btn btn-primary btn-sm" onclick="openBookModal()">+ Book appointment</button>
  </div>
  <div class="card table-wrap">
    <table id="appt-table">
      <thead><tr><th>Doctor</th><th>Date &amp; time</th><th>Reason</th><th>Status</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <h2 class="section-heading">My medical history</h2>
  <div class="card table-wrap">
    <table id="records-table">
      <thead><tr><th>Visit date</th><th>Doctor</th><th>Diagnosis</th><th>Treatment</th><th>Prescription</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <h2 class="section-heading">My profile</h2>
  <div class="card">
    <form id="profile-form">
      <div class="form-row">
        <div><label>Date of birth</label><input name="dob" type="date"></div>
        <div><label>Gender</label>
          <select name="gender"><option value="">Select…</option><option>Male</option><option>Female</option><option>Other</option></select>
        </div>
      </div>
      <div class="form-row">
        <div><label>Blood group</label>
          <select name="bloodGroup"><option value="">Select…</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select>
        </div>
        <div><label>Contact number</label><input name="contact"></div>
      </div>
      <label>Address</label><textarea name="address" rows="2"></textarea>
      <button type="submit" class="btn btn-ghost" style="margin-top:16px;">Save profile</button>
    </form>
  </div>
</div>

<div class="modal-backdrop" id="book-modal" style="display:none;">
  <div class="modal">
    <h3>Book an appointment</h3>
    <form id="book-form">
      <label>Doctor</label>
      <select name="doctorId" id="doctor-select" required></select>
      <label>Date &amp; time</label>
      <input name="appointmentTime" type="datetime-local" required>
      <label>Reason for visit</label>
      <textarea name="reason" rows="2" placeholder="e.g. Recurring headaches, follow-up checkup…"></textarea>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" onclick="closeBookModal()">Cancel</button>
        <button type="submit" class="btn btn-primary">Book</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-backdrop" id="reschedule-modal" style="display:none;">
  <div class="modal">
    <h3>Reschedule appointment</h3>
    <form id="reschedule-form">
      <label>New date &amp; time</label>
      <input name="appointmentTime" type="datetime-local" required>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" onclick="closeRescheduleModal()">Cancel</button>
        <button type="submit" class="btn btn-primary">Confirm</button>
      </div>
    </form>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/patient.js"></script>
</body>
</html>
